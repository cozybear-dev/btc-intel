[project]
name = "btcintel"
version = "0.1.0"
description = "Open-source Bitcoin blockchain intelligence: tracing, clustering, risk screening"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "httpx[socks]>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
btcintel = "btcintel.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btcintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["network: hits the live internet (run with -m network)"]
addopts = "-m 'not network' --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long literals (test vectors, SQL, URLs) are clearer unwrapped

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design (B008)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]
