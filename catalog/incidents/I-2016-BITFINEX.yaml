id: I-2016-BITFINEX
name: Bitfinex hack and laundering (Lichtenstein & Morgan)
date: '2016-08-02'
loss: 119,754 BTC stolen; more than 94,000 BTC recovered in 2022
btc: 119754.0
vector:
- O-KEY-COMPROMISE
actor: Ilya Lichtenstein (hacker), assisted in laundering by Heather Morgan
attribution: confirmed
techniques:
- O-PEEL-CHAIN
- O-DISPERSAL
- O-DARKNET-AS-MIXER
- O-CHAIN-HOP
- O-FAKE-KYC
- O-DORMANCY
summary: Lichtenstein breached Bitfinex in 2016 and fraudulently authorised more than 2,000 transactions
  moving 119,754 BTC to a wallet he controlled. The couple laundered part of the proceeds through fictitious-identity
  accounts, automated transactions, darknet markets (notably AlphaBay) and exchanges, chain hopping, mixers
  and gold. In 2022 agents decrypted files containing the wallet's private keys and seized more than 94,000
  BTC; both pleaded guilty in 2023.
