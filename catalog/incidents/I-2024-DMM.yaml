- O-KEY-COMPROMISE
actor: North Korea's TraderTraitor / Lazarus Group
attribution: confirmed
techniques:
- O-CUSTODIAL-MIXER
- O-CHAIN-HOP
- O-OTC-P2P
summary: On 31 May 2024, 4,502.9 BTC left DMM Bitcoin in a single transaction and was split across ten
  wallets of 500 BTC. U.S. and Japanese authorities attributed the hack to North Korea in December 2024.
  Reporting describes the proceeds going through a mixer, bridging onward (THORChain, Avalanche Bridge,
  Threshold), conversion to USDT on Tron and deposits to Huione Guarantee (~$35M in July 2024).
